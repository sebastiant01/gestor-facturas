<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios - Gestor Facturas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<main class="container">
    <nav>
        <ul>
            <li><strong>Usuarios Activos</strong></li>
        </ul>
        <ul>
            <li><a th:href="@{/inicio}" class="secondary">Inicio</a></li>
            <li><a th:href="@{/usuarios/nuevo}" role="button">+ Nuevo Usuario</a></li>
        </ul>
    </nav>

    <article th:if="${mensajeExito}" style="background-color: #1b4332; color: white;" th:text="${mensajeExito}"></article>
    <article th:if="${mensaje}" style="background-color: #1b4332; color: white;" th:text="${mensaje}"></article>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado Contraseña</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombreUsuario}">Nombre</td>
                <td th:text="${u.correo}">correo@dominio.com</td>
                <td><mark th:text="${u.rol}">EMPLEADO</mark></td>
                <td th:text="${u.contrasenaEsTemporal ? 'Temporal (Pendiente)' : 'Definitiva'}">Definitiva</td>
                <td>
                    <a th:href="@{/usuarios/{id}(id=${u.idUsuario})}" role="button" class="outline">
                        Ver / Editar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="5">No hay usuarios activos registrados.</td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
