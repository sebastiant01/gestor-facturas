# ====== Archivo de ejemplo de variables de entorno ======

# ==========================================
# 1. LOGIN WEB (Regular Web Application)
# ==========================================
spring.security.oauth2.client.registration.auth0.client-id=CLIENT_ID_DE_LA_WEB_APP
spring.security.oauth2.client.registration.auth0.client-secret=CLIENT_SECRET_DE_LA_WEB_APP
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.provider.auth0.issuer-uri=https://TU-DOMINIO.us.auth0.com/

# ==========================================
# 2. FACHADA MANAGEMENT API (M2M Application)
# ==========================================
auth0.management.enabled=true
auth0.domain=TU-DOMINIO.us.auth0.com
auth0.management.client-id=CLIENT_ID_DE_LA_M2M_APP
auth0.management.client-secret=CLIENT_SECRET_DE_LA_M2M_APP
auth0.connection=Username-Password-Authentication

# ===========================================
# 3. CONEXIÓN A NEON (POSTGRESQL) 
# ===========================================
spring.datasource.url=jdbc:postgresql://TU_HOST_DE_NEON.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=TU_USUARIO_NEON
spring.datasource.password=TU_PASSWORD_NEON
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# 4. CONFIGURACIÓN DEL ORM (HIBERNATE / JPA)
# ===========================================
# 'update' crea las tablas automáticamente a partir de tus @Entity sin borrar datos previos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las consultas SQL que ejecuta Hibernate (súper útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

